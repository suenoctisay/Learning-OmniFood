<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assets/styles/reset.css">

    <link rel="icon" href="assets/favicon/favicon.png" type="image/png" alt="favicon">
    <title>OmniFood</title>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <img class="header-logo" src="assets/img/omnifood-logo.png" alt="OmniFood logo">
      <nav class="header-main-nav">Navegation</nav>
    </header>

    <!-- HERO SECTION -->
    <main>
      <section class="hero-section">
        <div class="hero">
          <div class="hero-text">
            <h1 class="hero-heading-primary"> 
              A healthy meal delivered to your door, every single day
            </h1>

            <p class="hero-description">
              The smart 365-days-per-year food subscription that will make you eat healthy again. Tailored to your personal tastes and nutritional needs.
            </p>

            <a class="hero-button-link btn-full" href="#">Start eating well</a>
            <a class="hero-button-link btn-outline" href="#">Learn more &darr;</a>

            <div class="hero-customers-section">
              <div class="hero-customers-container">
                <img class="hero-customers" src="assets/img/customers/customer-1.jpg" alt="customers img">
                <img class="hero-customers" src="assets/img/customers/customer-2.jpg" alt="customers img">
                <img class="hero-customers" src="assets/img/customers/customer-3.jpg" alt="customers img">
                <img class="hero-customers" src="assets/img/customers/customer-4.jpg" alt="customers img">
                <img class="hero-customers" src="assets/img/customers/customer-5.jpg" alt="customers img">
              </div>
              <p class="hero-customers-text">
                <span>200,000+</span> meals delivered last year!
              </p>
            </div>
          </div>
          <div class="hero-image">
            <img class="hero-img" src="assets/img/hero.png" alt="hero img">
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
